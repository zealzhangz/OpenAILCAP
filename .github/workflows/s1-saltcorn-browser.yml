name: S1 Saltcorn real Chromium editor and browser-to-Agent consistency
on:
  push:
    paths:
      - '.github/workflows/s1-saltcorn-browser.yml'
      - 'experiments/platform-saltcorn/browser/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install real third-party platform and real headless Chromium
        run: |
          set -euo pipefail
          timeout 540s npm install -g @saltcorn/cli@1.7.0-beta.5 --no-audit --no-fund
          python3 -m pip install 'playwright==1.56.0'
          timeout 540s python3 -m playwright install --with-deps chromium
          saltcorn --version
      - name: Configure isolated app, create real test administrator and sidecar
        run: |
          set -euo pipefail
          export SQLITE_FILEPATH="$RUNNER_TEMP/s1-browser.sqlite"
          export SALTCORN_SESSION_SECRET="$(openssl rand -hex 32)"
          export S1_ADMIN_PASSWORD="$(openssl rand -hex 28)"
          echo "::add-mask::$SALTCORN_SESSION_SECRET"
          echo "::add-mask::$S1_ADMIN_PASSWORD"
          echo "SQLITE_FILEPATH=$SQLITE_FILEPATH" >> "$GITHUB_ENV"
          echo "SALTCORN_SESSION_SECRET=$SALTCORN_SESSION_SECRET" >> "$GITHUB_ENV"
          echo "S1_ADMIN_PASSWORD=$S1_ADMIN_PASSWORD" >> "$GITHUB_ENV"
          echo "SALTCORN_NWORKERS=1" >> "$GITHUB_ENV"
          timeout 120s saltcorn reset-schema -f
          timeout 120s saltcorn install-pack -f experiments/platform-saltcorn/contract-pack.json
          timeout 120s saltcorn run-js -f experiments/platform-saltcorn/seed-contract.js
          timeout 120s saltcorn run-js -f experiments/platform-saltcorn/browser/create-ledger.js
          timeout 120s saltcorn create-user --admin --email s1-research-admin@example.invalid --password "$S1_ADMIN_PASSWORD" \
            > "$RUNNER_TEMP/browser-create-user.log" 2>&1 || {
              sed -E 's/[Pp]assword[^ ]*/[REDACTED]/g' "$RUNNER_TEMP/browser-create-user.log" | tail -n 25
              exit 1
            }
          test -s "$SQLITE_FILEPATH"
      - name: Start actual Saltcorn Web editor
        run: |
          set -euo pipefail
          saltcorn serve --port 3100 --noscheduler > "$RUNNER_TEMP/s1-browser-server.log" 2>&1 &
          ready=0
          for i in $(seq 1 90); do
            if curl -fsS --max-time 3 -o /dev/null http://127.0.0.1:3100/auth/login; then
              ready=1; break
            fi
            sleep 2
          done
          if [ "$ready" != "1" ];then
            tail -n 75 "$RUNNER_TEMP/s1-browser-server.log"
            exit 1
          fi
      - name: Real Chromium login, two stale editor tabs, field save and physical DB readback
        run: |
          python3 experiments/platform-saltcorn/browser/browser_roundtrip.py \
            --db "$SQLITE_FILEPATH" --port 3100 \
            --output /tmp/s1-browser-ui-result.json
      - name: Negative control - simulated Agent CAS after browser bypassed ledger
        run: |
          set -euo pipefail
          timeout 120s saltcorn run-js -f experiments/platform-saltcorn/browser/agent-sidecar.js \
            > "$RUNNER_TEMP/s1-agent-sidecar.log" 2>&1
          grep '^S1_BROWSER_AGENT|' "$RUNNER_TEMP/s1-agent-sidecar.log"
          python3 experiments/platform-saltcorn/browser/verify_agent.py \
            --db "$SQLITE_FILEPATH" --output /tmp/s1-browser-agent-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s1-real-chromium-saltcorn-editor
          path: |
            /tmp/s1-browser-ui-result.json
            /tmp/s1-browser-agent-result.json
          if-no-files-found: warn
