name: S1 B9 authoritative Domain Kernel plus disposable real Saltcorn projections
on:
  pull_request:
    paths:
      - '.github/workflows/s1-b9-authority-projection.yml'
      - 'experiments/g1-b01-b9/**'
  push:
    paths:
      - '.github/workflows/s1-b9-authority-projection.yml'
      - 'experiments/g1-b01-b9/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-authority-and-disposable-native-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Exact official Saltcorn and real Playwright Chromium
        run: |
          set -euo pipefail
          timeout 540s npm install -g @saltcorn/cli@1.7.0-beta.5 --no-audit --no-fund
          python3 -m pip install 'playwright==1.56.0' 'cryptography>=44,<48'
          timeout 540s python3 -m playwright install --with-deps chromium
          saltcorn --version
      - name: Compile B9 and test strict release-to-pack compiler
        run: |
          set -euo pipefail
          python3 -m py_compile experiments/g1-b01-b9/*.py
          cd experiments/g1-b01-b9
          python3 -u -m unittest -v test_projector test_pack_approval_gate test_p0b_business \
            2>&1 | tee /tmp/s1-b9-projector-unit.log
      - name: B11 B12 B13 B14 signed-outbox durable Consumer/IPC regression
        run: |
          set -euo pipefail
          (cd experiments/g1-b01-b11 && python3 -u -m unittest -v test_projection) \
            2>&1 | tee /tmp/s1-b9-b11-regression.log
          (cd experiments/g1-b01-b12 && python3 -u -m unittest -v test_consumer) \
            2>&1 | tee /tmp/s1-b9-b12-regression.log
          (cd experiments/g1-b01-b13 && python3 -u -m unittest -v test_ipc_guard) \
            2>&1 | tee /tmp/s1-b9-b13-regression.log
          (cd experiments/g1-b01-b14 && python3 -u -m unittest -v test_signed_security) \
            2>&1 | tee /tmp/s1-b9-b14-regression.log
      - name: B2 trusted schema/store and B5 ToolBroker regressions
        run: |
          set -euo pipefail
          (cd experiments/g1-b01-b2 && python3 -u -m unittest -v test_schema) \
            2>&1 | tee /tmp/s1-b9-b2-regression.log
          (cd experiments/g1-b01-b5 && python3 -u -m unittest -v test_ir test_broker) \
            2>&1 | tee /tmp/s1-b9-b5-regression.log
      - name: Pull real Docker sandbox image, pin actual image ID, test B6 host relay
        run: |
          set -euo pipefail
          timeout 300s docker pull python:3.13-alpine
          IMAGE_ID="$(docker image inspect python:3.13-alpine --format '{{.Id}}')"
          [[ "$IMAGE_ID" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "S1_B9_PINNED_DOCKER_IMAGE=$IMAGE_ID" >> "$GITHUB_ENV"
          echo "S1_B9_ACTUAL_SANDBOX_IMAGE|$IMAGE_ID"
          python3 -m py_compile experiments/g1-b01-b6/plugin_isolation.py experiments/g1-b01-b6/plugin_untrusted.py
          (cd experiments/g1-b01-b6 && python3 -u -m unittest -v test_isolation) \
            2>&1 | tee /tmp/s1-b9-b6-host-relay-policy.log
      - name: Create separate Kernel, Saltcorn, plugin, Publisher and public read-only Linux identities
        run: |
          set -euo pipefail
          sudo -n useradd --system --no-create-home --shell /usr/sbin/nologin ailcapb9kern
          sudo -n useradd --system --no-create-home --shell /usr/sbin/nologin ailcapb9run
          sudo -n useradd --system --no-create-home --shell /usr/sbin/nologin ailcapb9plug
          sudo -n groupadd --system ailcapb9public
          sudo -n usermod -aG ailcapb9public ailcapb9kern
          sudo -n groupadd --system ailcapb9ipc
          sudo -n usermod -aG ailcapb9ipc ailcapb9run
          sudo -n useradd --system --no-create-home --shell /usr/sbin/nologin ailcapb9pub
          sudo -n useradd --system --no-create-home --shell /usr/sbin/nologin -G ailcapb9public ailcapb9ro
          sudo -n useradd --system --no-create-home --shell /usr/sbin/nologin -G ailcapb9ipc ailcapb9cons
          id ailcapb9kern
          id ailcapb9run
          id ailcapb9plug
          id ailcapb9pub
          id ailcapb9ro
          id ailcapb9cons
          [[ "$(id -u ailcapb9kern)" != "$(id -u ailcapb9run)" ]]
          [[ "$(id -u ailcapb9kern)" != "$(id -u ailcapb9plug)" ]]
          [[ "$(id -u ailcapb9run)" != "$(id -u ailcapb9plug)" ]]
          [[ "$(id -u ailcapb9kern)" != "$(id -u ailcapb9pub)" ]]
          [[ "$(id -u ailcapb9run)" != "$(id -u ailcapb9pub)" ]]
          [[ "$(id -u ailcapb9plug)" != "$(id -u ailcapb9pub)" ]]
          [[ "$(id -u ailcapb9pub)" != "$(id -u ailcapb9ro)" ]]
          [[ "$(id -u ailcapb9kern)" != "$(id -u ailcapb9ro)" ]]
          [[ "$(id -u ailcapb9run)" != "$(id -u ailcapb9ro)" ]]
          [[ "$(id -u ailcapb9plug)" != "$(id -u ailcapb9ro)" ]]
          for name in ailcapb9kern ailcapb9run ailcapb9plug ailcapb9pub ailcapb9ro; do
            [[ "$(id -u "$name")" != "$(id -u ailcapb9cons)" ]]
          done
      - name: SAME B2 B11 signed durable Consumer AF_UNIX B14 B15/B17 Chromium replay outage recovery
        env:
          DEEPSEEK_KEY: ''
        run: |
          set -euo pipefail
          python3 -u experiments/g1-b01-b9/experiment.py \
            --output /tmp/s1-b9-evidence.json \
            2>&1 | tee /tmp/s1-b9-real-e2e.log
      - name: Retain actual logs and structured authority/runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s1-b9-authority-projection-rebuild-rollback-evidence
          path: |
            /tmp/s1-b9-projector-unit.log
            /tmp/s1-b9-b2-regression.log
            /tmp/s1-b9-b5-regression.log
            /tmp/s1-b9-b6-host-relay-policy.log
            /tmp/s1-b9-b11-regression.log
            /tmp/s1-b9-b12-regression.log
            /tmp/s1-b9-b13-regression.log
            /tmp/s1-b9-b14-regression.log
            /tmp/s1-b9-evidence.json
            /tmp/s1-b9-real-e2e.log
          if-no-files-found: warn
