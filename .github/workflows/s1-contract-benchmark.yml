name: S1 Contract acceptance-spec oracle
on:
  push:
    paths:
      - 'experiments/contract-benchmark/**'
      - '.github/workflows/s1-contract-benchmark.yml'
  pull_request:
    paths:
      - 'experiments/contract-benchmark/**'
      - '.github/workflows/s1-contract-benchmark.yml'
permissions:
  contents: read
jobs:
  spec-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify preregistered contract cases
        run: python3 -m unittest discover -s experiments/contract-benchmark -p 'validate_spec.py' -v
      - name: Print platform NOT_RUN baseline
        run: python3 experiments/contract-benchmark/validate_spec.py --summary
