name: S1 B15 Linux dual-stack forced native HTTP and sixth-UID atomic signed public snapshot
on:
  pull_request:
    paths:
      - '.github/workflows/s1-b15-host-firewall-published-snapshot.yml'
      - 'experiments/g1-b01-b15/**'
  push:
    paths:
      - '.github/workflows/s1-b15-host-firewall-published-snapshot.yml'
      - 'experiments/g1-b01-b15/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel-ed25519-consumer-native-auditor-router:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install real Saltcorn CLI Chromium Ed25519 and netfilter
        run: |
          set -euo pipefail
          timeout 540s npm install -g @saltcorn/cli@1.7.0-beta.5 --no-audit --no-fund
          python3 -m pip install 'playwright==1.56.0' 'cryptography>=44,<48'
          timeout 540s python3 -m playwright install --with-deps chromium
          if ! command -v iptables || ! command -v ip6tables; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq iptables
          fi
          sudo iptables --version
          sudo ip6tables --version
          saltcorn --version
      - name: B15 public snapshot and firewall units + B14 B13 B12 B11 B10 B2 B5 regressions
        run: |
          set -euo pipefail
          python3 -m py_compile experiments/g1-b01-b15/*.py
          (cd experiments/g1-b01-b15 && python3 -u -m unittest -v test_published_network) \
            2>&1 | tee /tmp/s1-b15-units.log
          python3 -m py_compile experiments/g1-b01-b14/*.py
          (cd experiments/g1-b01-b14 && python3 -u -m unittest -v test_signed_security) \
            2>&1 | tee /tmp/s1-b15-b14-regression.log
          (cd experiments/g1-b01-b13 && python3 -u -m unittest -v test_ipc_guard) \
            2>&1 | tee /tmp/s1-b15-b13-regression.log
          (cd experiments/g1-b01-b12 && python3 -u -m unittest -v test_consumer) \
            2>&1 | tee /tmp/s1-b15-b12-regression.log
          (cd experiments/g1-b01-b11 && python3 -u -m unittest -v test_projection) \
            2>&1 | tee /tmp/s1-b15-b11-regression.log
          (cd experiments/g1-b01-b10 && python3 -u -m unittest -v test_router) \
            2>&1 | tee /tmp/s1-b15-b10-regression.log
          (cd experiments/g1-b01-b2 && python3 -u -m unittest -v test_schema) \
            2>&1 | tee /tmp/s1-b15-b2-regression.log
          (cd experiments/g1-b01-b5 && python3 -u -m unittest -v test_ir test_broker) \
            2>&1 | tee /tmp/s1-b15-b5-regression.log
      - name: Create 6 real nonroot UIDs, isolated Native readers and Publisher snapshot groups
        run: |
          set -euo pipefail
          sudo -n groupadd --system ailcapb13pipe
          sudo -n groupadd --system ailcapb13guard
          sudo -n groupadd --system ailcapb14pipe
          sudo -n groupadd --system ailcapb14guard
          sudo -n groupadd --system ailcapb14readers
          sudo -n groupadd --system ailcapb15snap
          sudo -n useradd --system --no-create-home --shell /usr/sbin/nologin ailcapb13kern
          sudo -n useradd --system --no-create-home --shell /usr/sbin/nologin \
            -G ailcapb13pipe,ailcapb13guard,ailcapb14pipe ailcapb13salt
          sudo -n useradd --system --no-create-home --shell /usr/sbin/nologin \
            -G ailcapb13guard,ailcapb14guard,ailcapb15snap ailcapb13route
          sudo -n useradd --system --no-create-home --shell /usr/sbin/nologin \
            -G ailcapb13pipe,ailcapb14pipe ailcapb13cons
          sudo -n useradd --system --no-create-home --shell /usr/sbin/nologin \
            -G ailcapb14readers,ailcapb14guard ailcapb14audit
          sudo -n useradd --system --no-create-home --shell /usr/sbin/nologin \
            -g ailcapb15snap -G ailcapb14readers ailcapb15pub
          for u in ailcapb13kern ailcapb13salt ailcapb13route ailcapb13cons ailcapb14audit ailcapb15pub; do id "$u"; done
          [[ "$(id -u ailcapb13salt)" != "$(id -u ailcapb14audit)" ]]
          [[ "$(id -u ailcapb13route)" != "$(id -u ailcapb14audit)" ]]
          [[ "$(id -u ailcapb13salt)" != "$(id -u ailcapb15pub)" ]]
          [[ "$(id -u ailcapb14audit)" != "$(id -u ailcapb15pub)" ]]
      - name: Real B2 signed outbox + six UIDs + atomic public snapshot + IPv4 IPv6 firewall + Saltcorn Chromium
        env:
          DEEPSEEK_KEY: ''
        run: |
          set -euo pipefail
          python3 -u experiments/g1-b01-b15/experiment.py \
            --output /tmp/s1-b15-evidence.json \
            2>&1 | tee /tmp/s1-b15-e2e.log
      - name: Upload real 210 unit contracts and 148 end-to-end firewall snapshot and tamper evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s1-b15-host-firewall-published-snapshot-evidence
          path: |
            /tmp/s1-b15-units.log
            /tmp/s1-b15-b14-regression.log
            /tmp/s1-b15-b13-regression.log
            /tmp/s1-b15-b12-regression.log
            /tmp/s1-b15-b11-regression.log
            /tmp/s1-b15-b10-regression.log
            /tmp/s1-b15-b2-regression.log
            /tmp/s1-b15-b5-regression.log
            /tmp/s1-b15-evidence.json
            /tmp/s1-b15-e2e.log
          if-no-files-found: warn
