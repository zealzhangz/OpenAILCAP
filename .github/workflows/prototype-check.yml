name: OpenAILCAP prototype checks

on:
  push:
    paths:
      - "openailcap-prototype/**"
      - "doc/整改/**"
  pull_request:
    paths:
      - "openailcap-prototype/**"
      - "doc/整改/**"

jobs:
  prototype-static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run static and feature-preservation tests
        working-directory: openailcap-prototype
        run: npm test
