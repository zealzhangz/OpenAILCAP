name: S1 B11 real authoritative B2 outbox to live Saltcorn v1-v2 projection
on:
  pull_request:
    paths:
      - '.github/workflows/s1-b11-real-business-outbox-projection.yml'
      - 'experiments/g1-b01-b11/**'
  push:
    paths:
      - '.github/workflows/s1-b11-real-business-outbox-projection.yml'
      - 'experiments/g1-b01-b11/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-b2-sql-outbox-to-two-live-saltcorn:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install actual Saltcorn and real Chromium
        run: |
          set -euo pipefail
          timeout 540s npm install -g @saltcorn/cli@1.7.0-beta.5 --no-audit --no-fund
          python3 -m pip install 'playwright==1.56.0'
          timeout 540s python3 -m playwright install --with-deps chromium
          saltcorn --version
      - name: B11 transactional outbox and native replay unit tests
        run: |
          set -euo pipefail
          python3 -m py_compile experiments/g1-b01-b11/*.py
          (cd experiments/g1-b01-b11 && python3 -u -m unittest -v test_projection) \
            2>&1 | tee /tmp/s1-b11-projection-units.log
      - name: B10 real route-pointer policy regression
        run: |
          set -euo pipefail
          (cd experiments/g1-b01-b10 && python3 -u -m unittest -v test_router) \
            2>&1 | tee /tmp/s1-b11-router-regression.log
      - name: B2 and B5 real core regression
        run: |
          set -euo pipefail
          (cd experiments/g1-b01-b2 && python3 -u -m unittest -v test_schema) \
            2>&1 | tee /tmp/s1-b11-b2-regression.log
          (cd experiments/g1-b01-b5 && python3 -u -m unittest -v test_ir test_broker) \
            2>&1 | tee /tmp/s1-b11-b5-regression.log
      - name: Three isolated real non-root Linux UIDs
        run: |
          set -euo pipefail
          sudo -n useradd --system --no-create-home --shell /usr/sbin/nologin ailcapb11kern
          sudo -n useradd --system --no-create-home --shell /usr/sbin/nologin ailcapb11salt
          sudo -n useradd --system --no-create-home --shell /usr/sbin/nologin ailcapb11route
          id ailcapb11kern
          id ailcapb11salt
          id ailcapb11route
          [[ "$(id -u ailcapb11kern)" != "$(id -u ailcapb11salt)" ]]
          [[ "$(id -u ailcapb11kern)" != "$(id -u ailcapb11route)" ]]
          [[ "$(id -u ailcapb11salt)" != "$(id -u ailcapb11route)" ]]
      - name: Genuine B2 outbox to two live native Saltcorn SQLite and Chromium
        env:
          DEEPSEEK_KEY: ''
        run: |
          set -euo pipefail
          python3 -u experiments/g1-b01-b11/experiment.py \
            --output /tmp/s1-b11-evidence.json \
            2>&1 | tee /tmp/s1-b11-e2e.log
      - name: Upload raw evidence and failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s1-b11-real-b2-outbox-two-live-saltcorn-native-evidence
          path: |
            /tmp/s1-b11-projection-units.log
            /tmp/s1-b11-router-regression.log
            /tmp/s1-b11-b2-regression.log
            /tmp/s1-b11-b5-regression.log
            /tmp/s1-b11-evidence.json
            /tmp/s1-b11-e2e.log
          if-no-files-found: warn
