name: S1 real Chromium human → gated Agent patch → Chromium human
on:
  push:
    paths:
      - '.github/workflows/s1-collab-editor.yml'
      - 'experiments/platform-saltcorn/collab/**'
  workflow_dispatch:
    inputs:
      live_model:
        description: Run exactly one real DeepSeek patch proposal, otherwise offline preflight
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  actual-human-agent-human:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate restricted patch schema with no API calls
        run: |
          set -euo pipefail
          python3 -m py_compile experiments/platform-saltcorn/collab/*.py
          python3 -m unittest discover -s experiments/platform-saltcorn/collab -p 'test_*.py' -v
      - name: Install actual Saltcorn and real Chromium
        run: |
          set -euo pipefail
          timeout 540s npm install -g @saltcorn/cli@1.7.0-beta.5 --no-audit --no-fund
          python3 -m pip install 'playwright==1.56.0'
          timeout 540s python3 -m playwright install --with-deps chromium
          saltcorn --version
      - name: Isolated real Saltcorn and temporary admin
        run: |
          set -euo pipefail
          export SQLITE_FILEPATH="$RUNNER_TEMP/s1-collab-native.sqlite"
          export SALTCORN_SESSION_SECRET="$(openssl rand -hex 32)"
          export S1_ADMIN_PASSWORD="$(openssl rand -hex 28)"
          for var in SALTCORN_SESSION_SECRET S1_ADMIN_PASSWORD;do
            echo "::add-mask::$(printenv "$var")"
            echo "$var=$(printenv "$var")" >> "$GITHUB_ENV"
          done
          echo "SQLITE_FILEPATH=$SQLITE_FILEPATH" >> "$GITHUB_ENV"
          echo "SALTCORN_NWORKERS=1" >> "$GITHUB_ENV"
          timeout 120s saltcorn reset-schema -f
          timeout 120s saltcorn install-pack -f experiments/platform-saltcorn/contract-pack.json
          timeout 120s saltcorn run-js -f experiments/platform-saltcorn/seed-contract.js
          timeout 120s saltcorn create-user --admin \
            --email s1-research-admin@example.invalid \
            --password "$S1_ADMIN_PASSWORD" >/dev/null
          test -s "$SQLITE_FILEPATH"
      - name: Start real native Saltcorn Web editor
        run: |
          set -euo pipefail
          saltcorn serve --port 3100 --noscheduler > "$RUNNER_TEMP/collab-server.log" 2>&1 &
          ready=0
          for n in $(seq 1 85);do
            if curl -fsS --max-time 3 -o /dev/null http://127.0.0.1:3100/auth/login;then ready=1;break;fi
            sleep 2
          done
          if [[ "$ready" != "1" ]];then tail -n 70 "$RUNNER_TEMP/collab-server.log";exit 1;fi
      - name: HUMAN 1 - actual Chromium browser saves a title field
        run: |
          set -euo pipefail
          python3 -u experiments/platform-saltcorn/collab/human_browser.py \
            --phase first --db "$SQLITE_FILEPATH" --output /tmp/s1-collab-first-human.json
      - name: DeepSeek sees true browser-saved snapshot and proposes only a typed label patch
        env:
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_KEY }}
          S1_MANUAL: ${{ inputs.live_model }}
          S1_ONCE: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[deepseek-collab-once]') }}
        run: |
          set -euo pipefail
          if [[ ( "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$S1_MANUAL" == "true" ) || ( "$GITHUB_EVENT_NAME" == "push" && "$S1_ONCE" == "true" ) ]];then
            echo "S1_COLLAB_REAL_DEEPSEEK_ONE_CALL"
            python3 -u experiments/platform-saltcorn/collab/propose.py \
              --live --human-snapshot /tmp/s1-collab-first-human.json \
              --output /tmp/s1-collab-proposal.json
          else
            echo "S1_COLLAB_NO_MODEL_PURE_NATIVE_PREFLIGHT"
            python3 -u experiments/platform-saltcorn/collab/propose.py \
              --human-snapshot /tmp/s1-collab-first-human.json \
              --output /tmp/s1-collab-proposal.json
          fi
      - name: Trusted controller builds fixed Native CAS adapter from checked JSON (NO generated JS)
        run: |
          set -euo pipefail
          python3 experiments/platform-saltcorn/collab/make_agent.py \
            --proposal /tmp/s1-collab-proposal.json \
            --template experiments/platform-saltcorn/collab/guarded-agent-template.js \
            --output "$RUNNER_TEMP/collab-agent.js"
      - name: AGENT - native SQLite guarded field update after human edit
        run: |
          set -euo pipefail
          timeout 120s saltcorn run-js -f "$RUNNER_TEMP/collab-agent.js" \
            > "$RUNNER_TEMP/collab-agent-applied.log" 2>&1 || {
              tail -n 70 "$RUNNER_TEMP/collab-agent-applied.log";exit 1;
            }
          grep 'S1_COLLAB_NATIVE_CAS|.*"decision":"APPLIED"' \
            "$RUNNER_TEMP/collab-agent-applied.log"
          cp "$RUNNER_TEMP/collab-agent-applied.log" /tmp/s1-collab-applied.log
      - name: HUMAN 2 - browser saves another human edit without losing AI status
        run: |
          set -euo pipefail
          python3 -u experiments/platform-saltcorn/collab/human_browser.py \
            --phase second --db "$SQLITE_FILEPATH" \
            --output /tmp/s1-collab-second-human.json
      - name: Negative control - stale AI patch after second human must be rejected
        run: |
          set -euo pipefail
          timeout 120s saltcorn run-js -f "$RUNNER_TEMP/collab-agent.js" \
            > "$RUNNER_TEMP/collab-agent-stale.log" 2>&1 || {
              tail -n 70 "$RUNNER_TEMP/collab-agent-stale.log";exit 1;
            }
          grep 'S1_COLLAB_NATIVE_CAS|.*"decision":"STALE_REJECTED"' \
            "$RUNNER_TEMP/collab-agent-stale.log"
          cp "$RUNNER_TEMP/collab-agent-stale.log" /tmp/s1-collab-stale.log
      - name: Independent native SQLite and live HTTP end-to-end acceptance
        run: |
          set -euo pipefail
          if grep -q '"model_inference_executed": true' /tmp/s1-collab-proposal.json;then
            python3 -u experiments/platform-saltcorn/collab/verify.py --live-model \
              --db "$SQLITE_FILEPATH" \
              --first-human /tmp/s1-collab-first-human.json \
              --proposal /tmp/s1-collab-proposal.json \
              --applied-log /tmp/s1-collab-applied.log \
              --second-human /tmp/s1-collab-second-human.json \
              --stale-log /tmp/s1-collab-stale.log \
              --output /tmp/s1-collab-result.json
          else
            python3 -u experiments/platform-saltcorn/collab/verify.py \
              --db "$SQLITE_FILEPATH" \
              --first-human /tmp/s1-collab-first-human.json \
              --proposal /tmp/s1-collab-proposal.json \
              --applied-log /tmp/s1-collab-applied.log \
              --second-human /tmp/s1-collab-second-human.json \
              --stale-log /tmp/s1-collab-stale.log \
              --output /tmp/s1-collab-result.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s1-chromium-deepseek-collab-evidence
          path: |
            /tmp/s1-collab-first-human.json
            /tmp/s1-collab-proposal.json
            /tmp/s1-collab-second-human.json
            /tmp/s1-collab-result.json
          if-no-files-found: warn
