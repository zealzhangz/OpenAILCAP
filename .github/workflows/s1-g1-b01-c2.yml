name: S1 C2 native field route package inspection (no model)
on:
  pull_request:
    paths:
      - '.github/workflows/s1-g1-b01-c2.yml'
      - 'experiments/g1-b01-c2/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-route-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install exact actual Saltcorn CLI
        run: |
          set -euo pipefail
          timeout 540s npm install -g @saltcorn/cli@1.7.0-beta.5 --no-audit --no-fund
          saltcorn --version
      - name: Inspect compiled native field route, context and write anchor
        run: |
          set -euo pipefail
          python3 experiments/g1-b01-c2/inspect.py > /tmp/s1-c2-route-probe.txt
          tail -n 100 /tmp/s1-c2-route-probe.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s1-c2-native-route-probe
          path: /tmp/s1-c2-route-probe.txt
          if-no-files-found: warn
